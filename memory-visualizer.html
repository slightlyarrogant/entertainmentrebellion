<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alex Memory Graph - Entertainment Discovery Rebellion</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <style>
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            overflow: hidden;
        }
        
        .container {
            display: flex;
            height: 100vh;
        }
        
        .sidebar {
            width: 350px;
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            overflow-y: auto;
            backdrop-filter: blur(10px);
        }
        
        .main-viz {
            flex: 1;
            position: relative;
        }
        
        .controls {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        
        .search-box {
            width: 250px;
            padding: 10px;
            border: none;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            margin-bottom: 15px;
        }
        
        .search-box::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }
        
        .node {
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .node:hover {
            stroke-width: 4px;
            filter: brightness(1.3);
        }
        
        .link {
            stroke: rgba(255, 255, 255, 0.4);
            stroke-width: 2;
            fill: none;
            marker-end: url(#arrowhead);
        }
        
        .link:hover {
            stroke: #ff6b6b;
            stroke-width: 4;
        }
        
        .node-label {
            fill: white;
            font-size: 11px;
            text-anchor: middle;
            pointer-events: none;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
            font-weight: bold;
        }
        
        .tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 15px;
            border-radius: 8px;
            font-size: 13px;
            max-width: 400px;
            pointer-events: none;
            z-index: 1000;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .entity-detail {
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            backdrop-filter: blur(10px);
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .entity-detail:hover {
            background: rgba(0, 0, 0, 0.7);
            border-color: #ff6b6b;
        }
        
        .entity-name {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 5px;
            color: #ff6b6b;
        }
        
        .entity-type {
            color: #4ecdc4;
            font-size: 11px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        
        .observations {
            font-size: 11px;
            line-height: 1.4;
            max-height: 120px;
            overflow-y: auto;
        }
        
        button {
            background: linear-gradient(45deg, #ff6b6b, #ee5a6f);
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            margin: 3px;
            transition: all 0.3s ease;
            font-size: 12px;
        }
        
        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
        }
        
        .status {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
        }
        
        .alex-highlight {
            stroke: #ffd700 !important;
            stroke-width: 5px !important;
            filter: drop-shadow(0 0 10px #ffd700);
        }
        
        .navigation-hint {
            position: absolute;
            bottom: 60px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
            font-size: 11px;
            max-width: 300px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h2>Alex's Memory Universe</h2>
            <div class="search-box-container">
                <input type="text" class="search-box" placeholder="Search Alex's memories..." id="sidebarSearch">
            </div>
            <div id="entity-list"></div>
        </div>
        
        <div class="main-viz">
            <div class="controls">
                <input type="text" class="search-box" placeholder="Search entities..." id="searchBox">
                <br>
                <button onclick="resetView()">Reset View</button>
                <button onclick="togglePhysics()">Toggle Physics</button>
                <button onclick="refreshData()">Refresh Data</button>
                <button onclick="focusOnAlex()">Focus Alex</button>
                <button onclick="zoomIn()">Zoom In</button>
                <button onclick="zoomOut()">Zoom Out</button>
            </div>
            <svg id="graph"></svg>
            <div class="status" id="status">Loading memory graph...</div>
            <div class="navigation-hint">
                🖱️ <strong>Navigation:</strong> Drag to pan • Scroll to zoom • Click nodes to explore • Drag nodes to position
            </div>
        </div>
    </div>
    
    <div class="tooltip" id="tooltip" style="display: none;"></div>

    <script>
        let memoryData = { entities: [], relations: [] };
        let physicsEnabled = true;
        let currentSimulation = null;
        let currentZoom = d3.zoom();
        let currentTransform = d3.zoomIdentity;

        // Set up SVG
        const svg = d3.select("#graph");
        const width = window.innerWidth - 350;
        const height = window.innerHeight;
        
        // Set up SVG with zoom and pan
        svg.attr("width", width).attr("height", height)
            .call(currentZoom.on("zoom", function(event) {
                currentTransform = event.transform;
                svg.selectAll("g").attr("transform", currentTransform);
            }))
            .on("dblclick.zoom", null); // Disable double-click zoom

        // Add arrow marker for directed edges
        svg.append("defs").append("marker")
            .attr("id", "arrowhead")
            .attr("viewBox", "0 -5 10 10")
            .attr("refX", 15)
            .attr("refY", 0)
            .attr("markerWidth", 6)
            .attr("markerHeight", 6)
            .attr("orient", "auto")
            .append("path")
            .attr("d", "M0,-5L10,0L0,5")
            .attr("fill", "rgba(255, 255, 255, 0.6)");

        // Color scale for entity types
        const colorScale = d3.scaleOrdinal()
            .domain([
                "demo_user_profile", "demo_subscription_profile", "demo_viewing_session", 
                "demo_adventure_evolution", "demo_content_evolution", "demo_behavior_analysis",
                "project", "technical_system", "context_recovery_guide", "briefing_instructions"
            ])
            .range([
                "#ff6b6b", "#e74c3c", "#45b7d1", "#3498db", "#9b59b6", 
                "#8e44ad", "#4ecdc4", "#16a085", "#f39c12", "#e67e22"
            ]);

        async function loadMemoryData() {
            try {
                updateStatus("Connecting to memory server...");
                const response = await fetch('/api/memory/graph');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                memoryData = await response.json();
                
                console.log('📊 Loaded memory data:', {
                    entities: memoryData.entities.length,
                    relations: memoryData.relations.length,
                    sampleEntities: memoryData.entities.slice(0, 3).map(e => e.name),
                    sampleRelations: memoryData.relations.slice(0, 3)
                });
                
                updateStatus(`Loaded ${memoryData.entities.length} entities, ${memoryData.relations.length} relations`);
                updateVisualization();
                updateEntityList();
            } catch (error) {
                console.error('Failed to load memory data:', error);
                updateStatus(`Error: ${error.message}`);
            }
        }

        function updateStatus(message) {
            document.getElementById("status").textContent = message;
        }

        function updateVisualization() {
            if (!memoryData.entities.length) {
                console.log('⚠️ No entities to visualize');
                updateStatus('No entities found in memory');
                return;
            }

            try {
                // Clear existing elements
                svg.selectAll("g").remove();

                // Create nodes and links data
                const nodes = memoryData.entities.map(d => ({
                    ...d,
                    id: d.name,
                    x: Math.random() * width,
                    y: Math.random() * height
                }));
                
                // Create entity name lookup for validation
                const entityNames = new Set(nodes.map(n => n.name));
                
                // Filter out invalid relations (where entities don't exist)
                const validLinks = memoryData.relations.filter(d => {
                    const fromExists = entityNames.has(d.from);
                    const toExists = entityNames.has(d.to);
                    
                    if (!fromExists || !toExists) {
                        console.log(`⚠️ Skipping invalid relation: ${d.from} → ${d.to} (missing: ${!fromExists ? d.from : ''} ${!toExists ? d.to : ''})`);
                        return false;
                    }
                    return true;
                }).map(d => ({
                    source: d.from,
                    target: d.to,
                    type: d.relationType
                }));
                
                console.log('🎨 Visualization data:', {
                    nodes: nodes.length,
                    validLinks: validLinks.length,
                    invalidLinks: memoryData.relations.length - validLinks.length,
                    alexNodes: nodes.filter(n => n.name.toLowerCase().includes('alex')).length
                });

                // Create link elements
                const linkGroup = svg.append("g");
                const link = linkGroup.selectAll("line")
                    .data(validLinks)
                    .enter().append("line")
                    .attr("class", "link")
                    .on("mouseover", function(event, d) {
                        showTooltip(event, `<strong>${d.source.name || d.source}</strong><br>↓ <em>${d.type}</em> ↓<br><strong>${d.target.name || d.target}</strong>`);
                    })
                    .on("mouseout", hideTooltip);

                // Create node elements
                const nodeGroup = svg.append("g");
                const node = nodeGroup.selectAll("circle")
                    .data(nodes)
                    .enter().append("circle")
                    .attr("class", "node")
                    .attr("r", d => {
                        if (d.name.toLowerCase().includes('alex')) return 25;
                        return Math.max(15, Math.min(30, d.observations?.length * 1.5 || 15));
                    })
                    .attr("fill", d => colorScale(d.entityType))
                    .attr("stroke", "#fff")
                    .attr("stroke-width", d => d.name.toLowerCase().includes('alex') ? 3 : 2)
                    .on("mouseover", function(event, d) {
                        const preview = d.observations ? d.observations.slice(0, 3).join('<br>• ') : 'No observations';
                        showTooltip(event, `<strong>${d.name}</strong><br><em>${d.entityType}</em><br><br>• ${preview}${d.observations?.length > 3 ? '...' : ''}`);
                    })
                    .on("mouseout", hideTooltip)
                    .on("click", function(event, d) {
                        showEntityDetail(d);
                        highlightEntity(d.name);
                    });

                // Add labels
                const labelGroup = svg.append("g");
                const label = labelGroup.selectAll("text")
                    .data(nodes)
                    .enter().append("text")
                    .attr("class", "node-label")
                    .text(d => {
                        if (d.name.length > 25) {
                            return d.name.substring(0, 25) + "...";
                        }
                        return d.name;
                    });

                // Create force simulation with error handling
                currentSimulation = d3.forceSimulation(nodes)
                    .force("link", d3.forceLink(validLinks).id(d => d.name).distance(120).strength(0.3))
                    .force("charge", d3.forceManyBody().strength(-300))
                    .force("center", d3.forceCenter(width / 2, height / 2))
                    .force("collision", d3.forceCollide().radius(50))
                    .force("x", d3.forceX(width / 2).strength(0.05))
                    .force("y", d3.forceY(height / 2).strength(0.05))
                    .on("error", function(error) {
                        console.error('🚨 Force simulation error:', error);
                        updateStatus('Simulation error - some connections may not display');
                    });
                    
                console.log('🔗 Force simulation created with', validLinks.length, 'valid links');

                // Add drag behavior
                node.call(d3.drag()
                    .on("start", dragstarted)
                    .on("drag", dragged)
                    .on("end", dragended));

                currentSimulation.on("tick", () => {
                    // Constrain nodes to viewport
                    nodes.forEach(d => {
                        d.x = Math.max(50, Math.min(width - 50, d.x));
                        d.y = Math.max(50, Math.min(height - 50, d.y));
                    });
                    
                    link
                        .attr("x1", d => d.source.x)
                        .attr("y1", d => d.source.y)
                        .attr("x2", d => d.target.x)
                        .attr("y2", d => d.target.y);

                    node
                        .attr("cx", d => d.x)
                        .attr("cy", d => d.y);

                    label
                        .attr("x", d => d.x)
                        .attr("y", d => d.y + 4);
                });
            
                updateStatus(`Visualization loaded: ${nodes.length} nodes, ${validLinks.length} connections`);
                
            } catch (error) {
                console.error('🚨 Visualization error:', error);
                updateStatus(`Visualization error: ${error.message}`);
                
                // Create a simple fallback visualization with just nodes
                const nodes = memoryData.entities.map((d, i) => ({
                    ...d,
                    id: d.name,
                    x: (i % 10) * 100 + 100,
                    y: Math.floor(i / 10) * 100 + 100
                }));
                
                const nodeGroup = svg.append("g");
                const node = nodeGroup.selectAll("circle")
                    .data(nodes)
                    .enter().append("circle")
                    .attr("class", "node")
                    .attr("r", 20)
                    .attr("fill", d => d.name.toLowerCase().includes('alex') ? '#ffd700' : '#ff6b6b')
                    .attr("cx", d => d.x)
                    .attr("cy", d => d.y)
                    .on("click", function(event, d) {
                        showEntityDetail(d);
                    });
                    
                console.log('🆘 Fallback visualization created with', nodes.length, 'nodes');
            }
        }

        function showTooltip(event, content) {
            const tooltip = document.getElementById("tooltip");
            tooltip.innerHTML = content;
            tooltip.style.display = "block";
            tooltip.style.left = (event.pageX + 10) + "px";
            tooltip.style.top = (event.pageY + 10) + "px";
        }

        function hideTooltip() {
            document.getElementById("tooltip").style.display = "none";
        }

        function showEntityDetail(entity) {
            const entityList = document.getElementById("entity-list");
            const detailHtml = `
                <div class="entity-detail" style="border: 2px solid #ff6b6b;">
                    <div class="entity-name">${entity.name}</div>
                    <div class="entity-type">${entity.entityType}</div>
                    <div class="observations">
                        ${entity.observations ? entity.observations.map(obs => `• ${obs}`).join('<br>') : 'No observations available'}
                    </div>
                </div>
            `;
            entityList.innerHTML = detailHtml + entityList.innerHTML;
        }

        function updateEntityList() {
            const entityList = document.getElementById("entity-list");
            const alexEntities = memoryData.entities.filter(e => e.name.toLowerCase().includes('alex'));
            const otherEntities = memoryData.entities.filter(e => !e.name.toLowerCase().includes('alex'));
            
            const allEntities = [...alexEntities, ...otherEntities];
            
            entityList.innerHTML = allEntities.map((entity, index) => `
                <div class="entity-detail" onclick="highlightEntity('${entity.name}')" ${entity.name.toLowerCase().includes('alex') ? 'style="border-left: 4px solid #ffd700;"' : ''}>
                    <div class="entity-name">${entity.name}</div>
                    <div class="entity-type">${entity.entityType}</div>
                    <div class="observations">
                        ${entity.observations ? entity.observations.slice(0, 2).map(obs => `• ${obs.substring(0, 60)}${obs.length > 60 ? '...' : ''}`).join('<br>') : 'No observations'}
                    </div>
                </div>
            `).join('');
        }

        function highlightEntity(entityName) {
            svg.selectAll(".node")
                .style("opacity", d => d.name === entityName ? 1 : 0.3)
                .classed("alex-highlight", d => d.name === entityName);
                
            svg.selectAll(".link")
                .style("opacity", d => 
                    d.source.name === entityName || d.target.name === entityName ? 0.8 : 0.1
                );
        }

        function focusOnAlex() {
            const alexNodes = memoryData.entities.filter(e => e.name.toLowerCase().includes('alex'));
            if (alexNodes.length > 0) {
                highlightEntity(alexNodes[0].name);
                showEntityDetail(alexNodes[0]);
                
                // Center view on Alex nodes
                if (currentSimulation && currentSimulation.nodes().length > 0) {
                    const alexSimNodes = currentSimulation.nodes().filter(n => n.name.toLowerCase().includes('alex'));
                    if (alexSimNodes.length > 0) {
                        const avgX = d3.mean(alexSimNodes, d => d.x);
                        const avgY = d3.mean(alexSimNodes, d => d.y);
                        
                        const transform = d3.zoomIdentity
                            .translate(width / 2 - avgX, height / 2 - avgY)
                            .scale(1.2);
                            
                        svg.transition().duration(1000)
                            .call(currentZoom.transform, transform);
                    }
                }
            } else {
                updateStatus('No Alex entities found');
            }
        }

        function resetView() {
            svg.selectAll(".node")
                .style("opacity", 1)
                .classed("alex-highlight", false);
                
            svg.selectAll(".link")
                .style("opacity", 1);
                
            if (currentSimulation) {
                currentSimulation.alpha(1).restart();
            }
            
            // Reset zoom and pan
            svg.transition().duration(1000)
                .call(currentZoom.transform, d3.zoomIdentity);
        }

        function togglePhysics() {
            physicsEnabled = !physicsEnabled;
            if (physicsEnabled && currentSimulation) {
                currentSimulation.alpha(1).restart();
            } else if (currentSimulation) {
                currentSimulation.stop();
            }
        }

        function zoomIn() {
            svg.transition().duration(300)
                .call(currentZoom.scaleBy, 1.5);
        }
        
        function zoomOut() {
            svg.transition().duration(300)
                .call(currentZoom.scaleBy, 0.67);
        }
        
        function panToNode(nodeName) {
            if (!currentSimulation) return;
            
            const node = currentSimulation.nodes().find(n => n.name === nodeName);
            if (node) {
                const transform = d3.zoomIdentity
                    .translate(width / 2 - node.x, height / 2 - node.y)
                    .scale(currentTransform.k);
                    
                svg.transition().duration(1000)
                    .call(currentZoom.transform, transform);
            }
        }

        async function refreshData() {
            await loadMemoryData();
        }

        // Search functionality
        document.getElementById("searchBox").addEventListener("input", function(e) {
            const searchTerm = e.target.value.toLowerCase();
            svg.selectAll(".node")
                .style("opacity", d => 
                    searchTerm === "" || 
                    d.name.toLowerCase().includes(searchTerm) || 
                    d.entityType.toLowerCase().includes(searchTerm) ||
                    (d.observations && d.observations.some(obs => obs.toLowerCase().includes(searchTerm)))
                    ? 1 : 0.2
                );
        });

        document.getElementById("sidebarSearch").addEventListener("input", function(e) {
            const searchTerm = e.target.value.toLowerCase();
            const entities = document.querySelectorAll(".entity-detail");
            entities.forEach(entity => {
                const text = entity.textContent.toLowerCase();
                entity.style.display = text.includes(searchTerm) ? "block" : "none";
            });
        });

        // Drag functions
        function dragstarted(event, d) {
            if (!event.active && currentSimulation) {
                currentSimulation.alphaTarget(0.3).restart();
            }
            d.fx = d.x;
            d.fy = d.y;
        }

        function dragged(event, d) {
            d.fx = event.x;
            d.fy = event.y;
        }

        function dragended(event, d) {
            if (!event.active && currentSimulation) {
                currentSimulation.alphaTarget(0);
            }
            d.fx = null;
            d.fy = null;
        }

        // Initialize
        loadMemoryData();

        // Handle window resize
        window.addEventListener("resize", function() {
            const newWidth = window.innerWidth - 350;
            const newHeight = window.innerHeight;
            svg.attr("width", newWidth).attr("height", newHeight);
            if (currentSimulation) {
                currentSimulation.force("center", d3.forceCenter(newWidth / 2, newHeight / 2));
                currentSimulation.alpha(1).restart();
            }
        });
    </script>
</body>
</html>
