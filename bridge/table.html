<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stolik brydżowy</title>
<style>
:root {
  --bg: #e9ece6; --panel: #f7f8f4; --fg: #1c241f; --muted: #5f6b63; --line: #c9d0c6;
  --felt: #1f5a44; --felt-deep: #17483a; --felt-fg: #eef5ef; --felt-muted: #a9c8b8;
  --card: #fbfaf5; --card-ink: #16181a; --card-red: #c0272d; --card-edge: #d8d5c8; --back: #7c2a34;
  --accent: #b9791a; --vul: #c0272d; --red-ink: #b3242a;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "DM Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "DM Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #121614; --panel: #1b211e; --fg: #e6ece7; --muted: #94a199; --line: #323b36;
  --felt: #1b4c3a; --felt-deep: #123529; --felt-muted: #9dbdad;
  --card: #f4f2ea; --card-edge: #bdb9a8; --back: #8a3440;
  --accent: #e0a23c; --vul: #e2575c; --red-ink: #ef7479; color-scheme: dark } }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.45; padding: 16px; }
.wrap { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; }
h1 { font-family: var(--display); font-size: 24px; margin: 0; }
.meta { color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 16px; }
.meta b { color: var(--fg); font-weight: 500; }
.note { color: var(--muted); font-size: 13px; margin: 0; }
.cols { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 820px) { .cols { grid-template-columns: minmax(0, 1fr); } }
button { font: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.felt { background: radial-gradient(ellipse at 50% 40%, var(--felt), var(--felt-deep)); color: var(--felt-fg);
  border-radius: 14px; padding: 14px; display: grid; gap: 10px;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr) minmax(0, 1fr);
  grid-template-areas: "n n n" "w mid e" "s s s" "tally tally tally"; }
.seat { min-width: 0; display: flex; flex-direction: column; gap: 6px; padding: 8px 10px; border-radius: 10px; border: 1px solid transparent; }
.seat.turn { border-color: var(--accent); background: rgba(0,0,0,.16); }
#seat-N { grid-area: n; align-items: center; } #seat-W { grid-area: w; align-self: center; }
#seat-E { grid-area: e; align-self: center; } #seat-S { grid-area: s; }
.who { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-family: var(--display); font-weight: 700; }
.who .pos { font-family: var(--mono); font-weight: 500; font-size: 12px; color: var(--felt-muted); }
.tag { font-family: var(--body); font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
  padding: 1px 6px; border-radius: 4px; border: 1px solid var(--felt-muted); }
.tag.vul { background: var(--vul); border-color: var(--vul); }
.tag.now { background: var(--accent); border-color: var(--accent); color: var(--card-ink); }
.hidden-hand { color: var(--felt-muted); font-size: 13px; }
.rows { display: flex; flex-direction: column; gap: 3px; font-family: var(--mono); font-size: 14px; }
.row { display: flex; gap: 6px; align-items: baseline; }
.suit { width: 1.1em; text-align: center; flex: none; }
.felt .suit.red { color: #ff9b9f; }
.chips { display: flex; flex-wrap: wrap; gap: 8px 16px; }
.grp { display: flex; flex-wrap: wrap; gap: 4px; }
.pc { background: var(--card); color: var(--card-ink); border: 1px solid var(--card-edge); border-radius: 6px;
  font-family: var(--mono); font-weight: 500; font-size: 17px; min-width: 42px; padding: 8px 4px; text-align: center;
  box-shadow: 0 1px 2px rgba(0,0,0,.25); white-space: nowrap; }
.pc.red { color: var(--card-red); }
button.pc:disabled { opacity: .45; cursor: default; }
button.pc:not(:disabled) { outline: 2px solid var(--accent); }
button.pc:not(:disabled):hover { transform: translateY(-3px); }
.mid { grid-area: mid; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, auto);
  gap: 4px; align-items: center; justify-items: center; min-height: 160px; padding: 6px;
  border: 1px dashed rgba(255,255,255,.22); border-radius: 10px; }
.mid .tN { grid-area: 1 / 2; } .mid .tW { grid-area: 2 / 1; } .mid .tE { grid-area: 2 / 3; } .mid .tS { grid-area: 3 / 2; }
.mid.old .pc { opacity: .55; }
.mid .ctr { grid-area: 2 / 2; text-align: center; font-size: 12px; color: var(--felt-muted); }
.tally { grid-area: tally; display: flex; flex-wrap: wrap; align-items: center; gap: 5px; min-height: 34px; font-size: 13px; color: var(--felt-muted); }
.tk { background: var(--back); border: 1px solid rgba(255,255,255,.5); border-radius: 3px; flex: none; }
.tk.won { width: 18px; height: 28px; }
.tk.lost { width: 28px; height: 18px; }
.tally b { color: var(--felt-fg); font-family: var(--display); font-size: 15px; margin-left: 8px; }

.side { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
section.box { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; min-width: 0; }
h2 { font-family: var(--display); font-size: 15px; margin: 0 0 10px; }
table { border-collapse: collapse; width: 100%; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.auction th { font-family: var(--body); font-size: 12px; color: var(--muted); text-align: left; padding: 0 6px 6px 0; }
.auction th.v { color: var(--vul); }
.auction td { padding: 3px 6px 3px 0; width: 25%; }
.red { color: var(--red-ink); } .dim { color: var(--muted); }
.bidbox { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-top: 12px; }
.bidbox button { padding: 7px 0; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font-family: var(--mono); }
.bidbox button.red { color: var(--red-ink); }
.bidbox button:disabled { opacity: .3; cursor: default; }
.bidbox .wide { grid-column: span 5; display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 4px; }
.bidbox .pass { background: var(--felt); color: var(--felt-fg); border-color: var(--felt); font-family: var(--body); font-weight: 700; }
.sheet { display: grid; grid-template-columns: 1fr 1fr; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.sheet > div { padding: 4px 10px; min-width: 0; }
.sheet .l { border-right: 1px solid var(--fg); }
.sheet .hd { font-family: var(--display); font-weight: 700; text-align: center; border-bottom: 1px solid var(--line); }
.sheet .above { display: flex; flex-direction: column-reverse; justify-content: flex-start; min-height: 56px; }
.sheet .theline { border-top: 2px solid var(--fg); }
.sheet .game { border-top: 1px solid var(--line); min-height: 26px; }
.sheet .tot { border-top: 2px solid var(--fg); text-align: right; }
.e { display: flex; justify-content: space-between; gap: 8px; }
.e span { font-family: var(--body); font-size: 12px; color: var(--muted); }
.log { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.banner { background: var(--panel); border: 1px solid var(--accent); border-radius: 10px; padding: 10px 14px; font-weight: 500;
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.banner select, .banner input { font: inherit; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
.banner button { padding: 8px 16px; border-radius: 8px; border: 0; background: var(--felt); color: var(--felt-fg); font-weight: 700; }
#err { color: var(--vul); font-weight: 500; min-height: 1.4em; }
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Stolik brydżowy</h1><div class="meta" id="meta"></div></header>
  <form class="banner" id="sit" hidden>
    <span>Usiądź przy stole:</span>
    <select id="sit-seat" aria-label="Miejsce"><option value="S">South</option><option value="N">North</option><option value="W">West</option><option value="E">East</option></select>
    <input id="sit-pass" type="password" placeholder="hasło stołu" aria-label="Hasło stołu" autocomplete="off">
    <button type="submit">Siadam</button>
    <span id="sit-note" class="note"></span>
  </form>
  <div class="banner" id="banner" hidden><span id="banner-text"></span><button id="deal" type="button">Rozdaj</button></div>
  <div class="cols">
    <div>
      <div class="felt">
        <div class="seat" id="seat-N"></div>
        <div class="seat" id="seat-W"></div>
        <div class="mid" id="mid"></div>
        <div class="seat" id="seat-E"></div>
        <div class="seat" id="seat-S"></div>
        <div class="tally" id="tally"></div>
      </div>
      <p id="err" role="alert"></p>
    </div>
    <div class="side">
      <section class="box"><h2>Licytacja</h2><div id="auction" class="dim">Czekam na rozdanie.</div><div class="bidbox" id="bidbox" hidden></div></section>
      <section class="box"><h2>Zapis robrowy</h2><div id="sheet"></div></section>
      <section class="box"><h2>Rozmowa przy stole</h2><div class="log" id="log"><span class="dim">Cisza.</span></div></section>
    </div>
  </div>
  <p class="note" id="status">Łączę ze stołem…</p>
</div>
<script>
const SEATS = ["N", "E", "S", "W"], SUITS = ["S", "H", "D", "C"], STRAINS = ["C", "D", "H", "S", "NT"];
const G = { S: "♠", H: "♥", D: "♦", C: "♣", NT: "BA" };
const NAMES = { N: "North", S: "South", W: "West", E: "East" };
let ME = "S", NAME = NAMES;
let token = new URLSearchParams(location.search).get("k");
try { token = token || localStorage.getItem("brydz-zeton"); } catch (e) {}
const RANK = r => ({ T: "10", Q: "D", J: "W" }[r] || r);
const isRed = s => s === "H" || s === "D";
const side = s => (s === "N" || s === "S") ? "ns" : "ew";
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
let st = null, sending = false;

async function act(path, body) {
  if (sending) return;
  sending = true; $("err").textContent = "";
  try {
    const r = await fetch("api/" + path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ...(body || {}), k: token }) });
    const j = await r.json();
    if (!j.ok) $("err").textContent = j.error || "Nie udało się wykonać ruchu.";
  } catch (e) { $("err").textContent = "Stół nie odpowiada. Spróbuj jeszcze raz."; }
  sending = false;
}

const callNode = c => c === "P" ? el("span", "dim", "pas") : c === "X" ? el("span", "red", "ktr") : c === "XX" ? el("span", "red", "rktr")
  : el("span", isRed(c.slice(1)) ? "red" : "", c[0] + G[c.slice(1)]);
const cardText = c => G[c[0]] + RANK(c[1]);

function chips(cards, legal) {
  const box = el("div", "chips");
  for (const s of SUITS) {
    const cs = cards.filter(c => c[0] === s);
    if (!cs.length) continue;
    const g = el("div", "grp");
    cs.forEach(c => {
      const b = el(legal ? "button" : "span", "pc" + (isRed(s) ? " red" : ""), cardText(c));
      if (legal) { b.type = "button"; b.disabled = !legal.includes(c); b.onclick = () => act("play", { card: c }); }
      g.append(b);
    });
    box.append(g);
  }
  return box;
}
function rows(cards) {
  const box = el("div", "rows");
  for (const s of SUITS) {
    const row = el("div", "row");
    const rs = cards.filter(c => c[0] === s).map(c => RANK(c[1]));
    row.append(el("span", "suit" + (isRed(s) ? " red" : ""), G[s]), el("span", "", rs.length ? rs.join(" ") : "—"));
    box.append(row);
  }
  return box;
}

function render() {
  if (!st || st.phase === "none") { $("status").textContent = "Gra jeszcze nie założona."; return; }
  ME = st.seat; NAME = { ...NAMES, [ME]: "Ty" };
  const us = side(ME), them = us === "ns" ? "ew" : "ns";
  const c = st.contract, playing = st.phase === "play";
  const meta = $("meta"); meta.replaceChildren();
  const add = (label, val) => { const s = el("span"); s.append(label + " ", el("b", "", val)); meta.append(s); };
  if (st.deal) add("Rozdanie", String(st.deal));
  if (c) add("Kontrakt", c.level + G[c.strain] + ["", " z kontrą", " z rekontrą"][c.dbl] + ", rozgrywa " + NAME[c.declarer]);
  if (st.phase === "auction") add("Trwa", "licytacja");

  const over = st.phase === "done" || st.phase === "idle";
  $("banner").hidden = !over;
  if (st.phase === "done") {
    $("banner-text").textContent = "Koniec rozdania. " + st.result.text + ". Zapis: My +" + (st.result[us] || 0) + ", Oni +" + (st.result[them] || 0) + ".";
    $("deal").textContent = st.score.done ? "Nowy rober" : "Następne rozdanie";
  } else if (st.phase === "idle") { $("banner-text").textContent = "Karty nie są rozdane."; $("deal").textContent = "Rozdaj"; }

  const mine = st.actor === ME;
  for (const s of SEATS) {
    const box = $("seat-" + s); box.replaceChildren();
    box.classList.toggle("turn", st.turn === s);
    const who = el("div", "who");
    who.append(el("span", "", NAME[s]), el("span", "pos", s));
    if (st.dealer === s) who.append(el("span", "tag", "rozdawał"));
    if (st.vul[side(s)]) who.append(el("span", "tag vul", "po partii"));
    if (c && c.declarer === s) who.append(el("span", "tag", "rozgrywa"));
    if (st.dummy === s) who.append(el("span", "tag", "dziadek"));
    if (st.turn === s) who.append(el("span", "tag now", s === ME && st.actor === ME ? "Twoja kolej" : st.phase === "auction" ? "licytuje" : "zagrywa"));
    box.append(who);
    if (st.phase === "idle") continue;
    const legal = playing && mine && st.turn === s ? st.legalCards : null;
    if (st.hands) box.append(s === ME ? chips(st.hands[s]) : rows(st.hands[s]));
    else if (s === ME) box.append(chips(st.hand, legal || (playing ? [] : null)));
    else if (st.dummy === s && st.dummyHand) box.append(legal ? chips(st.dummyHand, legal) : rows(st.dummyHand));
    else box.append(el("div", "hidden-hand", st.counts[s] + " kart, zakryte"));
  }

  const mid = $("mid"); mid.replaceChildren();
  const showLast = playing && !st.trick.length && st.lastTrick;
  const cards = showLast ? st.lastTrick.cards : (st.trick || []);
  mid.classList.toggle("old", !!showLast);
  cards.forEach(p => mid.append(el("span", "pc t" + p.seat + (isRed(p.card[0]) ? " red" : ""), cardText(p.card))));
  const ctr = el("div", "ctr");
  if (showLast) ctr.textContent = "wziął " + NAME[st.lastTrick.winner];
  else if (st.phase === "auction") ctr.textContent = "licytacja";
  mid.append(ctr);

  const tally = $("tally"); tally.replaceChildren();
  if (c) {
    (st.trickWinners || (st.history || []).map(t => t.winner)).forEach(w => tally.append(el("span", "tk " + (side(w) === us ? "won" : "lost"))));
    tally.append(el("b", "", "My " + st.won[us] + " : " + st.won[them] + " Oni"));
  }

  const au = $("auction");
  if (st.dealer) {
    au.className = "";
    const order = ["W", "N", "E", "S"], t = el("table", "auction"), hr = el("tr");
    order.forEach(s => hr.append(el("th", st.vul[side(s)] ? "v" : "", NAME[s])));
    t.append(hr);
    const cells = Array(order.indexOf(st.dealer)).fill(null).concat(st.auction.map(a => a.call));
    if (st.phase === "auction") cells.push("?");
    for (let i = 0; i < cells.length; i += 4) {
      const tr = el("tr");
      for (let j = 0; j < 4; j++) { const td = el("td"), x = cells[i + j]; if (x === "?") td.append(el("span", "dim", "…")); else if (x) td.append(callNode(x)); tr.append(td); }
      t.append(tr);
    }
    au.replaceChildren(t);
  }
  const bb = $("bidbox"); bb.hidden = !st.legalCalls; bb.replaceChildren();
  if (st.legalCalls) {
    const ok = x => st.legalCalls.includes(x), btn = (label, call, cls) => { const b = el("button", cls, label); b.type = "button"; b.disabled = !ok(call); b.onclick = () => act("bid", { call }); return b; };
    for (let lv = 1; lv <= 7; lv++) STRAINS.forEach(s => bb.append(btn(lv + G[s], lv + s, isRed(s) ? "red" : "")));
    const w = el("div", "wide"); w.append(btn("Pas", "P", "pass"), btn("Kontra", "X", "red"), btn("Rekontra", "XX", "red")); bb.append(w);
  }

  const sc = st.score, sh = el("div", "sheet"), entry = e => { const d = el("div", "e"); d.append(el("span", "", e.label), String(e.pts)); return d; };
  const cell = (cls, items) => { const d = el("div", cls); items.forEach(e => d.append(entry(e))); return d; };
  sh.append(el("div", "hd l", "My"), el("div", "hd", "Oni"), cell("above l", sc.above[us]), cell("above", sc.above[them]));
  sc.games.forEach((g, i) => sh.append(cell((i ? "game" : "theline") + " l", g[us]), cell(i ? "game" : "theline", g[them])));
  sh.append(el("div", "tot l", String(sc.totals[us])), el("div", "tot", String(sc.totals[them])));
  const note = el("p", "note", "Partie: My " + sc.won[us] + " · Oni " + sc.won[them] + (st.rubbers.length ? ". Skończone robry: " + st.rubbers.map(r => r[us] + ":" + r[them]).join(", ") : ""));
  $("sheet").replaceChildren(sh, note);

  if (st.log.length) $("log").replaceChildren(...st.log.slice(-12).map(m => { const d = el("div"); d.append(el("b", "", NAME[m.seat] + ": "), m.text); return d; }));

  $("status").textContent = st.legalCalls ? "Twoja odzywka." : (playing && mine) ? "Twój ruch: kliknij kartę" + (st.turn !== ME ? " dziadka." : ".")
    : over ? "" : "Czekamy na: " + NAME[st.actor] + (st.actor !== st.turn ? " (zagrywa z dziadka)" : "") + ".";
  $("status").style.fontWeight = over ? "" : "700";
  $("status").style.fontSize = over ? "" : "16px";
}

$("deal").onclick = () => act("deal");
$("sit").onsubmit = async ev => {
  ev.preventDefault();
  const r = await fetch("api/sit", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ seat: $("sit-seat").value, password: $("sit-pass").value }) });
  const j = await r.json();
  if (!j.ok) { $("sit-note").textContent = j.error; return; }
  token = j.result;
  try { localStorage.setItem("brydz-zeton", token); } catch (e) {}
  $("sit").hidden = true;
};
(async function poll() {
  for (;;) {
    if (!token) { $("sit").hidden = false; $("status").textContent = "Nie siedzisz jeszcze przy stole."; await new Promise(r => setTimeout(r, 800)); continue; }
    try {
      const r = await fetch("api/state?v=" + (st ? st.v : -1) + "&k=" + encodeURIComponent(token));
      if (r.status === 401) { token = null; st = null; try { localStorage.removeItem("brydz-zeton"); } catch (e) {} continue; }
      st = await r.json(); render();
    } catch (e) { $("status").textContent = "Brak połączenia ze stołem, próbuję ponownie…"; await new Promise(r => setTimeout(r, 2000)); }
  }
})();
</script>
</body>
</html>
