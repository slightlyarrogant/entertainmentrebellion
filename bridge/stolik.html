<title>Stolik brydżowy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Układ: sukno ze stołem (N u góry, S na dole, lewa pośrodku) po lewej; bloczek z licytacją i zapisem robrowym po prawej. */
:root {
  --bg: #e9ece6; --panel: #f7f8f4; --fg: #1c241f; --muted: #5f6b63; --line: #c9d0c6;
  --felt: #1f5a44; --felt-deep: #17483a; --felt-fg: #eef5ef; --felt-muted: #a9c8b8;
  --card: #fbfaf5; --card-ink: #16181a; --card-red: #c0272d; --card-edge: #d8d5c8;
  --accent: #b9791a; --vul: #c0272d; --red-ink: #b3242a; --back: #7c2a34;
  --display: "Bricolage Grotesque", "DM Sans", system-ui, sans-serif;
  --body: "DM Sans", system-ui, sans-serif;
  --mono: "DM Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121614; --panel: #1b211e; --fg: #e6ece7; --muted: #94a199; --line: #323b36;
  --felt: #1b4c3a; --felt-deep: #123529; --felt-fg: #eef5ef; --felt-muted: #9dbdad;
  --card: #f4f2ea; --card-ink: #16181a; --card-red: #c0272d; --card-edge: #bdb9a8;
  --accent: #e0a23c; --vul: #e2575c; --red-ink: #ef7479; --back: #8a3440; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121614; --panel: #1b211e; --fg: #e6ece7; --muted: #94a199; --line: #323b36;
  --felt: #1b4c3a; --felt-deep: #123529; --felt-fg: #eef5ef; --felt-muted: #9dbdad;
  --card: #f4f2ea; --card-ink: #16181a; --card-red: #c0272d; --card-edge: #bdb9a8;
  --accent: #e0a23c; --vul: #e2575c; --red-ink: #ef7479; --back: #8a3440; color-scheme: dark }

body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.45;
  padding-block: 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; }
h1 { font-family: var(--display); font-size: 26px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
.meta { color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 16px; }
.meta b { color: var(--fg); font-weight: 500; }
.note { color: var(--muted); font-size: 13px; }
.cols { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 820px) { .cols { grid-template-columns: minmax(0, 1fr); } }

/* sukno */
.felt { background: radial-gradient(ellipse at 50% 40%, var(--felt), var(--felt-deep)); color: var(--felt-fg);
  border-radius: 14px; padding: 14px; display: grid; gap: 10px;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr) minmax(0, 1fr);
  grid-template-areas: ". n ." "w mid e" "s s s" "tally tally tally"; }
.tally { grid-area: tally; display: flex; flex-wrap: wrap; align-items: center; gap: 5px; min-height: 30px; }
.tk { background: var(--back); border: 1px solid var(--felt-muted); border-radius: 3px; flex: none; }
.tk.won { width: 18px; height: 28px; }
.tk.lost { width: 28px; height: 18px; }
.tally b { font-family: var(--display); margin-left: 8px; }
.mid.old .pc { opacity: .55; }
.seat { min-width: 0; display: flex; flex-direction: column; gap: 6px; padding: 8px 10px; border-radius: 10px;
  border: 1px solid transparent; }
.seat.turn { border-color: var(--accent); background: rgba(0,0,0,.16); }
.seat-n { grid-area: n; } .seat-w { grid-area: w; } .seat-e { grid-area: e; } .seat-s { grid-area: s; }
.seat-w, .seat-e { align-self: center; }
.who { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-family: var(--display); font-weight: 700; }
.who .pos { font-family: var(--mono); font-weight: 500; font-size: 12px; color: var(--felt-muted); }
.tag { font-family: var(--body); font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
  padding: 1px 6px; border-radius: 4px; border: 1px solid var(--felt-muted); color: var(--felt-fg); }
.tag.vul { background: var(--vul); border-color: var(--vul); }
.tag.now { background: var(--accent); border-color: var(--accent); color: var(--card-ink); }
.hidden-hand { color: var(--felt-muted); font-size: 13px; }
.rows { display: flex; flex-direction: column; gap: 3px; font-family: var(--mono); font-size: 14px; }
.row { display: flex; gap: 6px; align-items: baseline; min-width: 0; }
.row .r { overflow-wrap: anywhere; }
.suit { width: 1.1em; text-align: center; flex: none; }
.felt .suit.red { color: #ff9b9f; }
.my-hand { display: flex; flex-wrap: wrap; gap: 8px 16px; }
.grp { display: flex; flex-wrap: wrap; gap: 4px; }
.pc { background: var(--card); color: var(--card-ink); border: 1px solid var(--card-edge); border-radius: 6px;
  font-family: var(--mono); font-weight: 500; font-size: 17px; min-width: 40px; padding: 7px 4px; text-align: center;
  box-shadow: 0 1px 2px rgba(0,0,0,.25); white-space: nowrap; }
.pc.red { color: var(--card-red); }
.pc.sm { font-size: 14px; min-width: 34px; padding: 4px 3px; }
.mid { grid-area: mid; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, auto);
  gap: 4px; align-items: center; justify-items: center; min-height: 150px; padding: 6px;
  border: 1px dashed rgba(255,255,255,.22); border-radius: 10px; }
.mid .tn { grid-area: 1 / 2; } .mid .tw { grid-area: 2 / 1; } .mid .te { grid-area: 2 / 3; } .mid .ts { grid-area: 3 / 2; }
.mid .ctr { grid-area: 2 / 2; text-align: center; font-size: 12px; color: var(--felt-muted); }
.mid .ctr strong { display: block; font-family: var(--display); font-size: 20px; color: var(--felt-fg); }
.last { grid-column: 1 / -1; font-size: 13px; color: var(--felt-muted); }

/* bloczek */
.side { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
section.box { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; min-width: 0; }
h2 { font-family: var(--display); font-size: 15px; font-weight: 700; margin: 0 0 10px; }
table { border-collapse: collapse; width: 100%; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.auction th { font-family: var(--body); font-size: 12px; font-weight: 700; color: var(--muted); text-align: left; padding: 0 6px 6px 0; }
.auction th.v { color: var(--vul); }
.auction td { padding: 3px 6px 3px 0; width: 25%; }
.red { color: var(--red-ink); }
.pc.red, .felt .pc.red { color: var(--card-red); }
.dim { color: var(--muted); }
.sheet { display: grid; grid-template-columns: 1fr 1fr; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.sheet > div { padding: 4px 10px; min-width: 0; }
.sheet .l { border-right: 1px solid var(--fg); }
.sheet .hd { font-family: var(--display); font-weight: 700; text-align: center; border-bottom: 1px solid var(--line); }
.sheet .above { display: flex; flex-direction: column-reverse; justify-content: flex-start; min-height: 64px; }
.sheet .theline { border-top: 2px solid var(--fg); }
.sheet .game { border-top: 1px solid var(--line); min-height: 26px; }
.sheet .tot { border-top: 2px solid var(--fg); font-weight: 500; text-align: right; }
.e { display: flex; justify-content: space-between; gap: 8px; }
.e span { font-family: var(--body); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.log { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.log b { font-family: var(--mono); font-weight: 500; }
.banner { background: var(--panel); border: 1px solid var(--accent); border-radius: 10px; padding: 10px 14px; font-weight: 500; }
</style>

<div class="wrap">
  <header>
    <h1>Stolik brydżowy</h1>
    <div class="meta" id="meta"></div>
  </header>
  <div class="banner" id="banner" hidden></div>
  <div class="cols">
    <div class="felt" id="felt">
      <div class="seat seat-n" id="seat-N"></div>
      <div class="seat seat-w" id="seat-W"></div>
      <div class="mid" id="mid"></div>
      <div class="seat seat-e" id="seat-E"></div>
      <div class="seat seat-s" id="seat-S"></div>
      <div class="tally" id="tally"></div>
    </div>
    <div class="side">
      <section class="box"><h2>Licytacja</h2><div id="auction" class="dim">Czekam na rozdanie.</div></section>
      <section class="box"><h2>Zapis robrowy</h2><div id="sheet"></div></section>
      <section class="box"><h2>Rozmowa przy stole</h2><div class="log" id="log"><span class="dim">Cisza.</span></div></section>
    </div>
  </div>
  <p class="note" id="status">Łączę ze stołem…</p>
</div>

<script>
const SEATS = ["N", "E", "S", "W"], SUITS = ["S", "H", "D", "C"];
const G = { S: "♠", H: "♥", D: "♦", C: "♣", NT: "BA" };
const NAME = { N: "Claude", S: "Ty", W: "West", E: "East" };
const RANK = r => ({ T: "10", Q: "D", J: "W" }[r] || r);
const isRed = s => s === "H" || s === "D";
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

// SHA-256 (do odszyfrowania własnej ręki; klucz i szyfrogram przychodzą ze stołu)
function sha256(msg) {
  const K = [], H = [], isP = n => { for (let i = 2; i * i <= n; i++) if (n % i === 0) return false; return true; };
  for (let n = 2; K.length < 64; n++) if (isP(n)) {
    if (H.length < 8) H.push((Math.pow(n, 1 / 2) * 4294967296) | 0);
    K.push((Math.pow(n, 1 / 3) * 4294967296) | 0);
  }
  const l = msg.length, n = ((l + 9 + 63) >> 6) << 6, b = new Uint8Array(n), w = new Int32Array(64);
  b.set(msg); b[l] = 0x80;
  new DataView(b.buffer).setUint32(n - 4, l * 8);
  const rr = (x, k) => (x >>> k) | (x << (32 - k));
  for (let o = 0; o < n; o += 64) {
    const dv = new DataView(b.buffer, o, 64);
    for (let i = 0; i < 16; i++) w[i] = dv.getInt32(i * 4);
    for (let i = 16; i < 64; i++) {
      const a = w[i - 15], c = w[i - 2];
      w[i] = (w[i - 16] + (rr(a, 7) ^ rr(a, 18) ^ (a >>> 3)) + w[i - 7] + (rr(c, 17) ^ rr(c, 19) ^ (c >>> 10))) | 0;
    }
    let [a, bb, c, d, e, f, g, h] = H;
    for (let i = 0; i < 64; i++) {
      const t1 = (h + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) | 0;
      const t2 = ((rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & bb) ^ (a & c) ^ (bb & c))) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = bb; bb = a; a = (t1 + t2) | 0;
    }
    H[0] = (H[0] + a) | 0; H[1] = (H[1] + bb) | 0; H[2] = (H[2] + c) | 0; H[3] = (H[3] + d) | 0;
    H[4] = (H[4] + e) | 0; H[5] = (H[5] + f) | 0; H[6] = (H[6] + g) | 0; H[7] = (H[7] + h) | 0;
  }
  const out = new Uint8Array(32), odv = new DataView(out.buffer);
  H.forEach((x, i) => odv.setInt32(i * 4, x));
  return out;
}
function decrypt(secret, v, hex) {
  const enc = new TextEncoder(), data = new Uint8Array(hex.length / 2);
  for (let i = 0; i < data.length; i++) data[i] = parseInt(hex.substr(i * 2, 2), 16);
  for (let i = 0; i < data.length; i += 32) {
    const ks = sha256(enc.encode(secret + "|" + v + "|" + (i / 32)));
    for (let j = 0; j < 32 && i + j < data.length; j++) data[i + j] ^= ks[j];
  }
  return JSON.parse(new TextDecoder().decode(data));
}

const callNode = c => {
  if (c === "P") return el("span", "dim", "pas");
  if (c === "X") return el("span", "red", "ktr");
  if (c === "XX") return el("span", "red", "rktr");
  const s = c.slice(1), n = el("span", isRed(s) ? "red" : "", c[0] + G[s]);
  return n;
};
const cardChip = (c, small) => el("span", "pc" + (isRed(c[0]) ? " red" : "") + (small ? " sm" : ""), G[c[0]] + RANK(c[1]));
function handRows(cards) {
  const box = el("div", "rows");
  for (const s of SUITS) {
    const row = el("div", "row");
    row.append(el("span", "suit" + (isRed(s) ? " red" : ""), G[s]));
    const rs = cards.filter(c => c[0] === s).map(c => RANK(c[1]));
    row.append(el("span", "r", rs.length ? rs.join(" ") : "—"));
    box.append(row);
  }
  return box;
}
function myHand(cards) {
  const box = el("div", "my-hand");
  for (const s of SUITS) {
    const cs = cards.filter(c => c[0] === s);
    if (!cs.length) continue;
    const g = el("div", "grp");
    cs.forEach(c => g.append(cardChip(c)));
    box.append(g);
  }
  if (!cards.length) box.append(el("span", "hidden-hand", "Brak kart."));
  return box;
}
const contractText = c => c.level + G[c.strain] + ["", " z kontrą", " z rekontrą"][c.dbl] + ", rozgrywa " + NAME[c.declarer] + " (" + c.declarer + ")";

let state = null, secret = null;

function render() {
  const st = state;
  if (!st) return;
  const side = s => (s === "N" || s === "S") ? "ns" : "ew";
  let mine = null;
  if (st.hands) mine = null;
  else if (secret && st.encS) { try { mine = decrypt(secret, st.v, st.encS); } catch (e) { mine = null; } }

  // nagłówek
  const meta = $("meta"); meta.replaceChildren();
  const add = (label, val) => { const s = el("span"); s.append(label + " ", el("b", "", val)); meta.append(s); };
  if (st.deal) add("Rozdanie", String(st.deal));
  if (st.contract) add("Kontrakt", contractText(st.contract));
  if (st.contract) add("Lewy", "My " + st.won.ns + " · Oni " + st.won.ew);
  if (st.phase === "auction") add("Trwa", "licytacja");

  const banner = $("banner");
  banner.hidden = !(st.phase === "done" || st.phase === "idle");
  if (st.phase === "done" && st.result) banner.textContent = "Koniec rozdania. " + st.result.text + ". Zapis: My +" + (st.result.ns || 0) + ", Oni +" + (st.result.ew || 0) + ".";
  if (st.phase === "idle") banner.textContent = "Karty jeszcze nie rozdane. Powiedz Claude'owi w rozmowie, żeby rozdał.";

  // miejsca
  for (const s of SEATS) {
    const box = $("seat-" + s); box.replaceChildren();
    box.classList.toggle("turn", st.turn === s);
    const who = el("div", "who");
    who.append(el("span", "", NAME[s]), el("span", "pos", s));
    if (st.dealer === s) who.append(el("span", "tag", "rozdawał"));
    if (st.vul && st.vul[side(s)]) who.append(el("span", "tag vul", "po partii"));
    if (st.contract && st.contract.declarer === s) who.append(el("span", "tag", "rozgrywa"));
    if (st.dummy === s) who.append(el("span", "tag", "dziadek"));
    if (st.turn === s) who.append(el("span", "tag now", "na ruchu"));
    box.append(who);
    if (st.phase === "idle") continue;
    if (st.hands) { s === "S" ? box.append(myHand(st.hands[s])) : box.append(handRows(st.hands[s])); continue; }
    if (s === "S") {
      if (mine) box.append(myHand(mine));
      else box.append(el("div", "hidden-hand", "Nie mogę odczytać Twojej ręki. Odśwież stronę."));
    } else if (st.dummy === s && st.dummyHand) box.append(handRows(st.dummyHand));
    else box.append(el("div", "hidden-hand", st.counts[s] + " kart, zakryte"));
  }

  // środek: bieżąca lewa, a tuż po jej zamknięciu jeszcze przez chwilę poprzednia
  const mid = $("mid"); mid.replaceChildren();
  const pos = { N: "tn", E: "te", S: "ts", W: "tw" };
  const showLast = st.phase === "play" && !(st.trick || []).length && st.lastTrick;
  mid.classList.toggle("old", !!showLast);
  (showLast ? st.lastTrick.cards : (st.trick || [])).forEach(p => { const c = cardChip(p.card); c.classList.add(pos[p.seat]); mid.append(c); });
  const ctr = el("div", "ctr");
  if (showLast) ctr.append("wziął " + NAME[st.lastTrick.winner]);
  else if (st.phase === "auction") ctr.append("licytacja");
  mid.append(ctr);
  // lewy odłożone jak przy stole: wzięta pionowo, oddana poziomo
  const tally = $("tally"); tally.replaceChildren();
  if (st.contract) {
    (st.trickWinners || []).forEach(w => tally.append(el("span", "tk " + (side(w) === "ns" ? "won" : "lost"))));
    tally.append(el("b", "", "My " + st.won.ns + " : " + st.won.ew + " Oni"));
  }

  // licytacja
  const au = $("auction");
  if (!st.dealer) { au.textContent = "Czekam na rozdanie."; }
  else {
    au.className = "";
    const order = ["W", "N", "E", "S"], t = el("table", "auction"), hr = el("tr");
    order.forEach(s => hr.append(el("th", st.vul[side(s)] ? "v" : "", NAME[s] + " " + s)));
    t.append(hr);
    const cells = Array(order.indexOf(st.dealer)).fill(null).concat(st.auction.map(a => a.call));
    if (st.phase === "auction") cells.push("?");
    for (let i = 0; i < cells.length; i += 4) {
      const tr = el("tr");
      for (let j = 0; j < 4; j++) {
        const td = el("td"), c = cells[i + j];
        if (c === "?") td.append(el("span", "dim", "…")); else if (c) td.append(callNode(c));
        tr.append(td);
      }
      t.append(tr);
    }
    au.replaceChildren(t);
  }

  // zapis
  const sc = st.score, sh = el("div", "sheet"), entry = e => { const d = el("div", "e"); d.append(el("span", "", e.label), String(e.pts)); return d; };
  const cell = (cls, items) => { const d = el("div", cls); items.forEach(e => d.append(entry(e))); return d; };
  sh.append(el("div", "hd l", "My"), el("div", "hd", "Oni"));
  sh.append(cell("above l", sc.above.ns), cell("above", sc.above.ew));
  sc.games.forEach((g, i) => sh.append(cell((i ? "game" : "theline") + " l", g.ns), cell(i ? "game" : "theline", g.ew)));
  sh.append(el("div", "tot l", String(sc.totals.ns)), el("div", "tot", String(sc.totals.ew)));
  const wrap = el("div"); wrap.append(sh);
  wrap.append(el("p", "note", "Partie: My " + sc.won.ns + " · Oni " + sc.won.ew + (sc.done ? ". Rober skończony." : "")));
  if (st.rubbers && st.rubbers.length) wrap.append(el("p", "note", "Skończone robry: " + st.rubbers.map(r => r.ns + ":" + r.ew).join(", ")));
  $("sheet").replaceChildren(wrap);

  // rozmowa
  const log = $("log");
  if (st.log && st.log.length) {
    log.replaceChildren(...st.log.slice(-12).map(m => { const d = el("div"); d.append(el("b", "", NAME[m.seat] + " (" + m.seat + "): "), m.text); return d; }));
  }
}

async function start() {
  const status = $("status");
  const db = window.claude && window.claude.use ? await window.claude.use("db") : null;
  if (!db) { status.textContent = "Stół jest niedostępny w tym widoku. Otwórz artefakt zalogowany w claude.ai."; return; }
  const timer = setTimeout(() => { status.textContent = "Nie mogę się połączyć ze stołem. Jeśli coś już widać, może być nieaktualne."; }, 10000);
  const fail = e => { clearTimeout(timer); status.textContent = "Połączenie ze stołem zerwane (" + (e && e.code) + "). Odśwież stronę."; };
  db.doc("game/key").onSnapshot(s => { if (s.exists) { secret = s.data().secret; render(); } }, fail);
  db.doc("game/state").onSnapshot(s => {
    if (!s.metadata.fromCache) { clearTimeout(timer); status.textContent = "Stół odświeża się sam, kilka sekund po każdym ruchu. Odzywki i zagrania podajesz Claude'owi w rozmowie."; }
    if (s.exists) { state = s.data(); render(); }
    else status.textContent = "Stół jest pusty. Claude jeszcze nie rozdał kart.";
  }, fail);
}
start();
</script>
